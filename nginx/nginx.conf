# ─────────────────────────────────────────────────────────────────────────────
#  Nginx Load Balancer Configuration — Distributed File Storage System
#
#  Traffic flow:
#    Client → Port 80 (Nginx) → Round-robin → Port 3001 or 3002 (Node.js)
#
#  To run Nginx with this config:
#    nginx -c /path/to/this/nginx.conf
#  Or if installed via Homebrew:
#    nginx -c "$(pwd)/nginx/nginx.conf"
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    # Max simultaneous connections per worker
    worker_connections 1024;
}

http {
    # ── MIME Types ──────────────────────────────────────────────────────────
    include       mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr';

    access_log /var/log/nginx/distributed_storage_access.log main;
    error_log  /var/log/nginx/distributed_storage_error.log  warn;

    # ── Performance ─────────────────────────────────────────────────────────
    sendfile           on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         application/json text/plain;

    # ── Upstream Pool (Round-Robin with Fault Tolerance) ─────────────────
    upstream backend_servers {
        # Strategy: Round-Robin (default)
        # max_fails  : mark server as unavailable after 3 consecutive failures
        # fail_timeout: keep it marked unavailable for 30 seconds then retry
        server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;

        # Uncomment for sticky sessions (if needed):
        # ip_hash;

        # Keepalive connections to upstream
        keepalive 16;
    }

    # ── Active Health Check (Nginx Plus only; passive checks work above) ──
    # For open-source Nginx, passive health checks via max_fails are used.
    # Nginx Plus users can add:
    #   health_check interval=10s uri=/health;

    # ── Server Block ─────────────────────────────────────────────────────
    server {
        listen      80;
        server_name localhost;

        # ── Root: API Proxy ──────────────────────────────────────────────
        location / {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;

            # Required for keepalive
            proxy_set_header   Connection        "";

            # Pass real client info to the Node.js servers
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # Allow large file uploads (must also match MAX_UPLOAD_MB in .env)
            client_max_body_size  50M;

            # ── Retry on failure ──────────────────────────────────────
            # If the chosen upstream errors, automatically try the other
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }

        # ── Health Check Passthrough ─────────────────────────────────────
        location /health {
            proxy_pass         http://backend_servers/health;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;   # Don't pollute logs with health polls
        }

        # ── Static Frontend Files ────────────────────────────────────────
        # Uncomment if you want Nginx to serve the frontend directly:
        #
        # location /ui/ {
        #     alias /path/to/distributed-file-storage/frontend/;
        #     index index.html;
        # }

        # ── Error Pages ──────────────────────────────────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
